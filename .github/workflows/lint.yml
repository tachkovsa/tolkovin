name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (no native rebuild needed for linting)
        run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
