<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      body {
        display: flex;
      }

      #sidebar {
        width: 150px;
        flex: none;
        padding: 14px 8px;
        background: rgba(128, 128, 128, 0.08);
        border-right: 1px solid rgba(128, 128, 128, 0.25);
        display: flex;
        flex-direction: column;
        gap: 2px;
        -webkit-app-region: drag;
      }
      #sidebar button {
        -webkit-app-region: no-drag;
        display: block;
        width: 100%;
        text-align: left;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      #sidebar button.active {
        background: #0a84ff;
        color: white;
      }

      #content {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 20px 24px;
      }

      section {
        display: none;
        flex-direction: column;
        gap: 14px;
      }
      section.active {
        display: flex;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 6px 8px;
        font: inherit;
        border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        color: inherit;
      }
      .field {
        display: flex;
        flex-direction: column;
      }
      button.primary {
        align-self: flex-start;
        padding: 7px 18px;
        border-radius: 6px;
        border: none;
        background: #0a84ff;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #settingsStatus {
        font-size: 12px;
        opacity: 0.7;
      }

      .stat-card {
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .stat-card .period {
        font-size: 11px;
        opacity: 0.65;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .stat-card .numbers {
        font-size: 20px;
        font-weight: 600;
        margin: 4px 0;
      }
      .stat-card .detail {
        font-size: 12px;
        opacity: 0.75;
      }

      #historyList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .item .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        opacity: 0.7;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 1px 7px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge.ok {
        background: rgba(48, 209, 88, 0.18);
        color: #2ca948;
      }
      .badge.partial {
        background: rgba(255, 214, 10, 0.2);
        color: #a17f00;
      }
      .badge.transcribe_error,
      .badge.paste_error {
        background: rgba(255, 69, 58, 0.18);
        color: #d70015;
      }
      .item .text {
        margin: 6px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .item .text.empty {
        opacity: 0.5;
        font-style: italic;
      }
      .item .error {
        font-size: 11px;
        color: #d70015;
        margin: 4px 0;
        word-break: break-word;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .actions button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        cursor: pointer;
        color: inherit;
      }
      .actions button.primary {
        background: #0a84ff;
        border-color: #0a84ff;
        color: white;
      }
      .actions button.danger {
        color: #d70015;
        border-color: rgba(215, 0, 21, 0.4);
      }
      #historyEmpty {
        opacity: 0.6;
        padding: 20px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <button data-section="history" class="active">History</button>
      <button data-section="dashboard">Dashboard</button>
      <button data-section="settings">Settings</button>
    </div>

    <div id="content">
      <section id="section-history" class="active">
        <h1>
          History
          <button id="historyRefresh" style="all: unset; color: #0a84ff; cursor: pointer">Refresh</button>
        </h1>
        <div id="historyList"></div>
        <div id="historyEmpty" style="display: none">No transcriptions yet.</div>
      </section>

      <section id="section-dashboard">
        <h1>Dashboard</h1>
        <div id="stat7" class="stat-card"></div>
        <div id="stat30" class="stat-card"></div>
      </section>

      <section id="section-settings">
        <h1>Settings</h1>
        <div class="field">
          <label for="apiKey">Yandex API Key</label>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="folder">Yandex Folder ID</label>
          <input id="folder" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="mic">Microphone</label>
          <select id="mic"></select>
        </div>
        <div class="field">
          <label for="price">Estimated price per minute (RUB, optional)</label>
          <input id="price" type="number" min="0" step="0.01" />
        </div>
        <button id="save" class="primary">Save</button>
        <span id="settingsStatus"></span>
      </section>
    </div>

    <script src="workspace-renderer.js"></script>
  </body>
</html>
